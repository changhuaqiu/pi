<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; font-family: monospace; }
  .wrap { text-align: center; }
  canvas { border: 2px solid #e94560; background: #16213e; }
  .info { color: #eee; margin-top: 12px; font-size: 16px; }
  button { margin-top: 10px; padding: 8px 24px; font-size: 16px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #d63851; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div class="info">得分: <span id="score">0</span></div>
  <button id="restart">重新开始</button>
</div>
<script>
const SIZE = 20;
const COLS = 20, ROWS = 20;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let snake, dir, nextDir, food, score, timer, gameOver;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  scoreEl.textContent = '0';
  placeFood();
  if (timer) clearInterval(timer);
  timer = setInterval(tick, 120);
}

function placeFood() {
  while (true) {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function tick() {
  if (gameOver) return;

  // 不允许反向
  if (!(nextDir.x === -dir.x && nextDir.y === -dir.y && snake.length > 1)) {
    dir = nextDir;
  }

  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
  // 撞自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function die() {
  gameOver = true;
  clearInterval(timer);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.font = '24px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke(); }
  for (let i = 0; i <= ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke(); }
  // 食物
  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);
  // 蛇
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#0f3460' : '#533483';
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1}, ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
                 w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0} };
  const d = map[e.key];
  if (d) { e.preventDefault(); nextDir = d; }
});

document.getElementById('restart').addEventListener('click', init);

init();
draw();
</script>
</body>
</html>
